name: Probe sources

on:
  workflow_dispatch:
    inputs:
      script:
        description: Probe script in tools/
        default: probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Versions and model files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/${{ inputs.script }}
